---
- name: gemini cli is absent
  community.general.npm:
    name: "@google/gemini-cli"
    global: true
    state: absent

- name: antigravity tasks are included
  ansible.builtin.include_tasks: antigravity.yml

- name: codex tasks are included
  ansible.builtin.include_tasks: codex.yml

- name: opencode is installed
  community.general.npm:
    name: "opencode-ai"
    global: true
    state: present

- name: claude code is installed
  ansible.builtin.shell:
    cmd: curl -fsSL https://claude.ai/install.sh | bash  # noqa: command-instead-of-module
    creates: /home/{{ user }}/.local/bin/claude
  become: true
  become_user: "{{ user }}"
