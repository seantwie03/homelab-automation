- name: asciinema is installed
  ansible.builtin.package:
    name: asciinema
    state: present

- name: symlink asciinema dotfiles directory
  ansible.builtin.file:
    src: "{{ dotfiles_path }}/asciinema"
    dest: /home/{{ user }}/.config/asciinema
    state: link
    follow: false
    owner: "{{ user }}"
    group: "{{ user }}"

- name: agg is installed
  ansible.builtin.get_url:
    url: https://github.com/asciinema/agg/releases/download/v{{ agg_version }}/agg-x86_64-unknown-linux-gnu
    dest: /home/{{ user }}/bin/agg
    checksum: sha256:{{ agg_checksum }}
    mode: 0550
    owner: "{{ user }}"
    group: "{{ user }}"
