---
- name: installed packages are gathered
  ansible.builtin.package_facts:
    manager: rpm

- name: zoom {{ zoom_version }} is installed
  when: >-
    'zoom' not in ansible_facts.packages
    or ansible_facts.packages.zoom[0].version != zoom_version
  block:
    - name: zoom rpm is downloaded
      ansible.builtin.get_url:
        url: https://zoom.us/client/{{ zoom_version }}/zoom_x86_64.rpm
        dest: /var/cache/zoom-{{ zoom_version }}-1.x86_64.rpm
        checksum: "{{ zoom_checksum }}"
        owner: root
        group: root
        mode: 0644
      register: zoom_download
      retries: 3
      delay: 10
      until: zoom_download is succeeded

    # DNF still asks RPM 6 to validate the rejected package header. RPM also
    # incorrectly reports insufficient space for this package on Btrfs.
    - name: zoom is installed  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          rpm --upgrade --nosignature --nodigest --ignoresize
          /var/cache/zoom-{{ zoom_version }}-1.x86_64.rpm
      changed_when: true
